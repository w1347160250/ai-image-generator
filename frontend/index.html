<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 图片生成器</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🎨 AI 图片生成器</h1>
        <p class="subtitle">输入描述，AI 为你生成图片</p>

        <div class="form-group">
            <label for="prompt">图片描述</label>
            <textarea id="prompt" rows="3" placeholder="例如：一只戴着墨镜的柴犬在海边冲浪"></textarea>
        </div>

        <div class="options-row">
            <div class="form-group">
                <label for="size">尺寸</label>
                <select id="size">
                    <option value="1024x1024">1024×1024（方形）</option>
                    <option value="1024x1536">1024×1536（竖版）</option>
                    <option value="1536x1024">1536×1024（横版）</option>
                </select>
            </div>
            <div class="form-group">
                <label for="quality">质量</label>
                <select id="quality">
                    <option value="low">低（快速）</option>
                    <option value="medium">中</option>
                    <option value="high">高（较慢）</option>
                </select>
            </div>
        </div>

        <button id="generateBtn" onclick="generateImage()">生成图片</button>

        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
            <p>正在生成中，请稍候...</p>
        </div>

        <div id="error" class="error hidden"></div>

        <div id="resultArea" class="result hidden">
            <img id="resultImage" alt="生成的图片">
            <button class="download-btn" onclick="downloadImage()">💾 下载图片</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
